server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy the Lorcana API (ClusterIP-only) same-origin so the browser and
    # odin-mcp share one NodePort. Variable proxy_pass + resolver so nginx
    # resolves per-request (a down API 502s this route instead of killing nginx).
    location /api/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $api lorcana-api.lorcana.svc.cluster.local;
        proxy_pass http://$api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # cache hashed assets aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html so react-router works on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
