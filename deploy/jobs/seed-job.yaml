apiVersion: batch/v1
kind: Job
metadata:
  name: lorcana-seed
  namespace: lorcana
  labels:
    app: lorcana-seed
    ai.odin.managed: "true"
    ai.odin.component: catalog-seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: lorcana-seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: localhost:30500/lorcana/api:fastapi-20260831-premprice-1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.jobs.seed_catalog"]
          envFrom:
            - secretRef:
                name: lorcana-db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
