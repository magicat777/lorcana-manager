apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lorcana

resources:
  - namespace.yaml
  - api/deployment.yaml
  - api/service.yaml
  - web/deployment.yaml
  - web/service.yaml
  - jobs/price-refresh-cronjob.yaml
  - jobs/daily-brief-cronjob.yaml

# NOTE: the lorcana-migrations ConfigMap is created by apply.sh from
# ../db/migrations/ (kustomize refuses file sources outside this directory).
