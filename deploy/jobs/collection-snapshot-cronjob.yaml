apiVersion: batch/v1
kind: CronJob
metadata:
  name: lorcana-collection-snapshot
  namespace: lorcana
  labels:
    app: lorcana-collection-snapshot
    ai.odin.managed: "true"
    ai.odin.component: collection-snapshot
spec:
  schedule: "0 6 * * *"
  timeZone: America/Los_Angeles   # 06:00 PT daily, after the 05:00 price refresh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: lorcana-collection-snapshot
        spec:
          restartPolicy: Never
          containers:
            - name: snapshot
              image: localhost:30500/lorcana/api:fastapi-20260822-foilsnap-1
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.jobs.snapshot_collection"]
              envFrom:
                - secretRef:
                    name: lorcana-db
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
