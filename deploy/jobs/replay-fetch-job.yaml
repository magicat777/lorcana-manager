apiVersion: batch/v1
kind: Job
metadata:
  name: lorcana-replay-fetch
  namespace: lorcana
  labels:
    app: lorcana-replay-fetch
    ai.odin.managed: "true"
    ai.odin.component: replay-fetch
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: lorcana-replay-fetch
    spec:
      restartPolicy: Never
      containers:
        - name: replay-fetch
          image: localhost:30500/lorcana/api:fastapi-20260921-replayread-1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.jobs.fetch_replays"]
          envFrom:
            - secretRef:
                name: lorcana-db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
