apiVersion: batch/v1
kind: Job
metadata:
  name: lorcana-rules-seed
  namespace: lorcana
  labels:
    app: lorcana-rules-seed
    ai.odin.managed: "true"
    ai.odin.component: rules-seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: lorcana-rules-seed
    spec:
      restartPolicy: Never
      containers:
        - name: rules-seed
          image: localhost:30500/lorcana/api:fastapi-20260904-rules-2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.jobs.seed_rules"]
          envFrom:
            - secretRef:
                name: lorcana-db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
