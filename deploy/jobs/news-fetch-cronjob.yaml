apiVersion: batch/v1
kind: CronJob
metadata:
  name: lorcana-news-fetch
  namespace: lorcana
  labels:
    app: lorcana-news-fetch
    ai.odin.managed: "true"
    ai.odin.component: news-fetch
spec:
  schedule: "30 14 * * *"   # 14:30 UTC, half an hour before the daily brief
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: lorcana-news-fetch
        spec:
          restartPolicy: Never
          containers:
            - name: news-fetch
              image: localhost:30500/lorcana/api:fastapi-20260817-stats-7
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.jobs.fetch_news"]
              envFrom:
                - secretRef:
                    name: lorcana-db
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
