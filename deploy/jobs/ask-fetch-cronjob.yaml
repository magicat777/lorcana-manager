apiVersion: batch/v1
kind: CronJob
metadata:
  name: lorcana-ask-fetch
  namespace: lorcana
  labels:
    app: lorcana-ask-fetch
    ai.odin.managed: "true"
    ai.odin.component: ask-fetch
spec:
  schedule: "30 5 * * *"
  timeZone: America/Los_Angeles   # 05:30 PT nightly, after the price refresh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: lorcana-ask-fetch
        spec:
          restartPolicy: Never
          containers:
            - name: ask-fetch
              image: localhost:30500/lorcana/api:fastapi-20260912-sealedauto-1
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.jobs.fetch_asks"]
              envFrom:
                - secretRef:
                    name: lorcana-db
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
