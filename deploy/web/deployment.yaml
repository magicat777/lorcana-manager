apiVersion: apps/v1
kind: Deployment
metadata:
  name: lorcana-web
  namespace: lorcana
  labels:
    app: lorcana-web
    ai.odin.managed: "true"
    ai.odin.component: frontend
    ai.odin.loki.app_category: lorcana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lorcana-web
  template:
    metadata:
      labels:
        app: lorcana-web
        ai.odin.managed: "true"
        ai.odin.component: frontend
        ai.odin.loki.app_category: lorcana
    spec:
      containers:
        - name: web
          image: localhost:30500/lorcana/web:nginx-20260821-foil-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
