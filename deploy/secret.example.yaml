# Template only — the real secret is created imperatively by apply.sh and never
# committed. Keys consumed by the api deployment and the migrate/seed jobs.
apiVersion: v1
kind: Secret
metadata:
  name: lorcana-db
  namespace: lorcana
type: Opaque
stringData:
  # Full DSN used by the API and jobs
  DATABASE_URL: postgresql://lorcana:CHANGE_ME@postgresql.odin-prime.svc.cluster.local:5432/lorcana
  # Same password, used by psql in the migrate job
  PGPASSWORD: CHANGE_ME
