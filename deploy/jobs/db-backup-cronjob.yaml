apiVersion: batch/v1
kind: CronJob
metadata:
  name: lorcana-db-backup
  namespace: lorcana
  labels:
    app: lorcana-db-backup
    ai.odin.managed: "true"
    ai.odin.component: db-backup
spec:
  schedule: "0 2 * * *"
  timeZone: America/Los_Angeles   # 02:00 PT nightly
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: lorcana-db-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              # The odin-prime postgres image so pg_dump matches the server
              # version exactly; also ships curl for the failure alert.
              image: localhost:30500/odin-prime/postgresql:odin-latest
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0   # hostPath dir is root-owned
              command:
                - sh
                - -ec
                - |
                  fail() {
                    echo "BACKUP FAILED: $1" >&2
                    if [ -n "${LORCANA_NTFY_URL:-}" ]; then
                      curl -s -m 15 -H "Title: Lorcana DB backup FAILED" \
                        -H "Tags: rotating_light" -d "$1" "$LORCANA_NTFY_URL" || true
                    fi
                    exit 1
                  }
                  ts=$(date -u +%Y%m%d-%H%M%S)
                  f="/backup/lorcana-$ts.dump"
                  pg_dump "$DATABASE_URL" -Fc -f "$f" || fail "pg_dump exited nonzero"
                  size=$(stat -c%s "$f")
                  [ "$size" -gt 100000 ] || fail "dump suspiciously small: $size bytes"
                  tables=$(pg_restore --list "$f" | grep -c "TABLE DATA" || true)
                  [ "$tables" -ge 10 ] || fail "only $tables table-data entries in dump"
                  echo "wrote $f ($size bytes, $tables tables)"
                  # Retention: prune AFTER the new dump verified, never before.
                  find /backup -name 'lorcana-*.dump' -mtime +30 -delete
                  echo "kept: $(ls /backup/lorcana-*.dump | wc -l) local dumps"
                  # Off-host copy to the Synology (freya-syn1618, NFS share
                  # already mounted on the node). The dump above is safely on
                  # local disk either way; a sync failure alerts and fails the
                  # job so it's visible, without having cost us the backup.
                  # /proc/mounts check: if the host mount is absent the bind
                  # target is a plain local dir — refuse to write into it.
                  grep -q " /nas nfs" /proc/mounts || fail "NAS share not mounted (dump is on local disk)"
                  mkdir -p /nas/k3s-backups/lorcana
                  synced=0
                  for d in /backup/lorcana-*.dump; do
                    b=$(basename "$d")
                    if [ ! -f "/nas/k3s-backups/lorcana/$b" ]; then
                      cp "$d" "/nas/k3s-backups/lorcana/.$b.tmp" \
                        && mv "/nas/k3s-backups/lorcana/.$b.tmp" "/nas/k3s-backups/lorcana/$b" \
                        || fail "copy of $b to NAS failed (dump is on local disk)"
                      synced=$((synced+1))
                    fi
                  done
                  find /nas/k3s-backups/lorcana -name 'lorcana-*.dump' -mtime +60 -delete
                  echo "NAS: synced $synced new, kept $(ls /nas/k3s-backups/lorcana/lorcana-*.dump | wc -l) dumps (60d retention)"
              envFrom:
                - secretRef:
                    name: lorcana-db
                - secretRef:
                    name: lorcana-ntfy
                    optional: true
              volumeMounts:
                - name: backups
                  mountPath: /backup
                - name: nas
                  mountPath: /nas
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: backups
              hostPath:
                # On the k3s LVM volume, outside any PVC lifecycle — deleting
                # k8s objects (even the namespace) cannot take the dumps with it.
                path: /mnt/lvm_k3s/backups/lorcana
                type: DirectoryOrCreate
            - name: nas
              hostPath:
                # The mountpoint itself (always present) rather than a subdir,
                # so the pod starts and the local dump happens even when the
                # NAS is down — the script then detects the missing NFS mount
                # via /proc/mounts and alerts instead of writing to local disk.
                path: /mnt/nas/odin-storage
                type: Directory
